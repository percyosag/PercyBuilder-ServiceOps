
services:
  ticket-db:
    image: postgres:18.4
    container_name: serviceops-ticket-db
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD:?Database password required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ticket_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ticket_db_data:
